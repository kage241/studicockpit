# Fragt Supabase einmal täglich kurz an, damit das kostenlose Projekt nicht wegen Inaktivität pausiert.
# Der Schlüssel ist der öffentliche „publishable key“, der ohnehin in der App steht.
name: Supabase wachhalten

on:
  schedule:
    - cron: '17 6 * * *'   # täglich um 06:17 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anfragen
        run: |
          status=$(curl -sS -o antwort.txt -w "%{http_code}" -X POST \
            "https://qmluxgojumdnuidvkdkk.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_HUlZIV-OjDsprSdmGIxAxQ_NSYh57iT" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $status: $(cat antwort.txt)"
          test "$status" = "200"
      # GitHub schaltet geplante Abläufe in öffentlichen Repositories nach 60 Tagen ohne Änderungen ab.
      # Dieser Schritt schaltet den Ablauf jedes Mal wieder ein, damit er auch in den Semesterferien weiterläuft.
      - name: Ablauf aktiv halten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-wachhalten.yml/enable"
