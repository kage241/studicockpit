<style>
/* Layout: Seitenleiste + Arbeitsfläche aus Karten; dunkel als bewusste Entscheidung, Akzent per Farbwahl */
:root {
  color-scheme: dark;
  --bg: #0E1014;
  --surface: #161920;
  --surface2: #1E2129;
  --surface3: #23272F;
  --line: #2A2E37;
  --fg: #ECEEF2;
  --soft: #B4BCC9;
  --muted: #9AA3B2;
  --accent: #C38BFF;
  --accent-hi: #DEC4FF;
  --accent-line: #432E66;
  --accent-bg: #1F1733;
  --accent2: #FF8FC7;
  --warn: #FFB86B;
  --ok: #8FE3B0;
  --bad: #FF9E8F;
  --display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  --body: Inter, 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-hi); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.3px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

.app { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1440px; margin: 0 auto; }
.nav { flex: 1 1 200px; max-width: 240px; background: var(--surface); border-radius: 20px; padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 16px; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--bg); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 17px; }
.brand span { font-family: var(--display); font-weight: 700; font-size: 18px; }
.nav a { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; color: var(--soft); text-decoration: none; white-space: nowrap; }
.nav a[aria-current="page"] { background: var(--surface3); color: var(--fg); font-weight: 600; }
.nav a[aria-current="page"] svg { stroke: var(--accent); }
.sync { margin-top: 12px; padding: 10px 12px; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
.sync.on i { background: var(--ok); }
.sync.warn i { background: var(--warn); }
main { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }

.kopf { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.kopf p { margin: 0 0 6px; color: var(--muted); font-size: 14px; }
.kopf h1 { font-size: clamp(26px, 3.2vw, 34px); }
.aktionen { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.farben { display: flex; gap: 2px; background: var(--surface); border-radius: 14px; padding: 2px 6px; }
.farben button { width: 40px; height: 40px; border: 0; background: transparent; border-radius: 50%; display: grid; place-items: center; cursor: pointer; padding: 0; }
.farben span { width: 22px; height: 22px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px transparent; }
.farben button[aria-pressed="true"] span { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--fg); }

.btn { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: var(--fg); text-decoration: none; }
.btn:hover { background: var(--surface2); }
.btn.primaer { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
.btn.primaer:hover { filter: brightness(1.08); background: var(--accent); }
.btn.klein { min-height: 36px; padding: 0 12px; font-size: 13px; }
.btn.gefahr { border-color: #6B2A2A; color: #FFB4A8; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; cursor: pointer; font-size: 20px; color: var(--fg); }
.icon-btn:hover { background: var(--surface2); }
.segment { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--surface); border-radius: 14px; padding: 4px; }
.segment button { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: transparent; cursor: pointer; color: var(--soft); font-weight: 500; }
.segment button[aria-pressed="true"] { background: var(--surface3); color: var(--fg); font-weight: 600; }
.filter { display: flex; flex-wrap: wrap; gap: 8px; }
.filter button { min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 13px; color: var(--soft); }
.filter button[aria-pressed="true"] { border-color: var(--accent); color: var(--fg); background: var(--accent-bg); }

.reihe { display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch; }
.karte { background: var(--surface); border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.karte.betont { border: 1px solid var(--accent-line); }
.karte h2 { font-size: 18px; }
.karte-kopf { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.karte-kopf a { font-size: 13px; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); }
.leise { color: var(--muted); font-size: 13px; margin: 0; }
.balken { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; display: flex; }
.balken > i { display: block; height: 100%; }
.balken .b { background: var(--accent); }
.balken .l { background: var(--accent2); }
.balken .g { background: var(--accent-line); }
.legende { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
.legende span { display: inline-flex; align-items: center; gap: 6px; }
.legende i { width: 10px; height: 10px; border-radius: 3px; }
.zeile { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface2); border: 0; text-align: left; width: 100%; color: var(--fg); }
button.zeile { cursor: pointer; }
.zeile .t { flex: 1; min-width: 0; }
.zeile .t b { display: block; font-weight: 600; font-size: 14px; }
.zeile .t small { display: block; font-size: 12px; color: var(--muted); }
.zeile.wrap { flex-wrap: wrap; }
.chip { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; white-space: nowrap; display: inline-flex; align-items: center; }
.chip.laeuft, .chip.inBearbeitung { background: color-mix(in srgb, var(--accent2) 20%, transparent); color: var(--accent2); }
.chip.bestanden, .chip.abgeschlossen { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent-hi); }
.chip.geplant { border: 1px solid var(--accent-line); color: var(--soft); }
.chip.offen { border: 1px solid var(--line); color: var(--muted); }
.chip.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.punkt { width: 12px; height: 12px; border-radius: 4px; flex: 0 0 auto; }
.check { display: flex; gap: 10px; align-items: center; min-height: 36px; font-size: 14px; background: none; border: 0; padding: 0; text-align: left; color: var(--fg); }
button.check { cursor: pointer; }
.check i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #59606C; flex: 0 0 auto; display: grid; place-items: center; font-style: normal; font-size: 12px; color: var(--bg); }
.check.ja i { border-color: var(--accent); background: var(--accent); }
.check.halb i { border-color: var(--accent2); background: var(--accent-bg); }
.check small { color: var(--muted); font-size: 12px; }
.leer { padding: 18px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.regel { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.4; }
.regel .s { flex: 0 0 auto; width: 16px; text-align: center; font-weight: 700; }
.regel.ok .s { color: var(--ok); }
.regel.fehlt .s { color: var(--bad); }
.regel.hinweis .s { color: var(--warn); }
.regel span:last-child { color: var(--soft); }

/* Dashboard */
.hero { display: flex; flex-wrap: wrap; gap: 28px; align-items: center; }
.hero svg { flex: 0 0 auto; max-width: 100%; height: auto; }
.hero-text { flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface2); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--display); font-size: 24px; font-weight: 700; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--muted); }
.bereich-kopf { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-bottom: 6px; }
.bereich-kopf span:last-child { color: var(--muted); white-space: nowrap; }
.modulzaehler { display: flex; flex-wrap: wrap; gap: 8px; }
.modulzaehler span { font-size: 13px; padding: 6px 10px; border-radius: 10px; background: var(--surface2); color: var(--soft); }
.modulzaehler b { color: var(--fg); font-family: var(--display); }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 20px; background: var(--surface); color: var(--fg); text-decoration: none; font-size: 13px; font-weight: 500; }

/* Stundenplan */
.wochen-nav { display: flex; align-items: center; gap: 2px; background: var(--surface); border-radius: 14px; padding: 2px; }
.wochen-nav div { min-width: 170px; text-align: center; }
.wochen-nav b { display: block; font-size: 14px; }
.wochen-nav small { font-size: 12px; color: var(--muted); }
.raster-box { overflow-x: auto; }
.raster { min-width: 640px; display: grid; grid-template-columns: 52px repeat(5, minmax(100px, 1fr)); gap: 0 8px; }
.tag-kopf { text-align: center; padding: 8px 0; border-radius: 12px; margin-bottom: 8px; }
.tag-kopf b { display: block; font-family: var(--display); font-size: 15px; }
.tag-kopf small { color: var(--muted); font-size: 12px; }
.tag-kopf.heute { background: var(--accent-bg); }
.tag-kopf.heute b { color: var(--accent); }
.zeiten { position: relative; }
.zeiten span { position: absolute; right: 6px; font-size: 12px; color: var(--muted); transform: translateY(-8px); }
.spalte { position: relative; border-radius: 12px; background-color: #13151A; background-image: repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px, transparent 56px); }
.spalte.heute { background-color: #1A1626; }
.block { position: absolute; left: 3px; right: 3px; border-radius: 12px; padding: 7px 9px; overflow: hidden; cursor: pointer; text-align: left; border: 1px solid; display: flex; flex-direction: column; gap: 2px; color: var(--fg); }
.block b { font-size: 13px; line-height: 1.25; }
.block small { font-size: 11px; color: var(--soft); }
.block .zeit { font-size: 12px; font-weight: 600; }
.block.geplant { border-style: dashed; opacity: 0.8; }
.jetzt-linie { position: absolute; left: 0; right: 0; height: 2px; background: var(--accent2); z-index: 2; }

/* Studium */
.bereich-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.bereich-karte { background: var(--surface); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.bereich-karte b { font-family: var(--display); font-size: 22px; }
.bereich-karte small { color: var(--muted); font-size: 12px; }
.sem-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.sem { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.sem.jetzt { border-color: var(--accent); background: var(--accent-bg); }
.sem-kopf { display: flex; justify-content: space-between; gap: 6px; align-items: center; font-weight: 600; font-size: 14px; }
.sem .cp { font-family: var(--display); font-size: 26px; font-weight: 700; }
.sem ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.sem li { font-size: 12px; color: var(--soft); display: flex; gap: 6px; align-items: baseline; }
.sem li i { width: 8px; height: 8px; border-radius: 3px; flex: 0 0 auto; transform: translateY(-1px); }
.gruppe { display: flex; flex-direction: column; gap: 4px; }
.gruppe-kopf { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 4px 4px 8px; }
.gruppe-kopf h2 { font-size: 18px; }
.modul { border-radius: 14px; background: var(--surface); }
.modul.offen-detail { background: var(--surface); outline: 1px solid var(--accent-line); }
.modul > button { width: 100%; display: flex; align-items: center; gap: 14px; min-height: 60px; background: none; border: 0; padding: 10px 14px; cursor: pointer; text-align: left; color: var(--fg); }
.modul .nr { width: 42px; font-family: var(--display); font-weight: 700; color: var(--muted); flex: 0 0 auto; font-size: 15px; }
.modul .mitte { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.modul .mitte .oben { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; align-items: baseline; }
.modul .mitte .oben b { font-weight: 600; }
.modul .mitte .oben span { color: var(--muted); white-space: nowrap; font-size: 13px; }
.modul-detail { padding: 2px 14px 18px 70px; display: flex; flex-direction: column; gap: 14px; }
@media (max-width: 600px) { .modul-detail { padding-left: 14px; } }
.fakten { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.fakt { background: var(--surface2); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.fakt span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
.fakt b { display: block; font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
.unter h3 { font-size: 14px; font-family: var(--body); font-weight: 600; margin-bottom: 8px; color: var(--soft); }
.lv { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 12px; background: var(--surface2); }
.lv .t { flex: 1 1 220px; min-width: 0; font-size: 14px; }
.lv .t small { display: block; color: var(--muted); font-size: 12px; }
.lv .re { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pruef { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }

/* Formulare & Dialog */
.overlay { position: fixed; inset: 0; background: rgba(5, 6, 9, 0.72); z-index: 20; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 24px) max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.dialog { width: 100%; max-width: 640px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.dialog h2 { font-size: 22px; }
.feld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.feld label, .feld .lbl { font-size: 13px; color: var(--soft); font-weight: 500; }
.feld input, .feld select, .feld textarea { min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); padding: 0 12px; width: 100%; }
.feld textarea { padding: 10px 12px; min-height: 70px; resize: vertical; }
.feld small { color: var(--muted); font-size: 12px; }
.felder { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.termin { display: grid; grid-template-columns: 1fr 1fr 1fr 1.4fr 44px; gap: 8px; align-items: end; }
@media (max-width: 560px) { .termin { grid-template-columns: 1fr 1fr 1fr; } }
.konflikt { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.konflikt.warn { color: var(--warn); }
.konflikt.ok { color: var(--ok); }
.farbwahl { display: flex; gap: 6px; flex-wrap: wrap; }
.farbwahl button { width: 36px; height: 36px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
.farbwahl button[aria-pressed="true"] { border-color: var(--fg); }
.fuss { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }

/* Termine */
.termin-zeile { display: flex; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--surface2); flex-wrap: wrap; }
.datum-box { width: 56px; height: 56px; border-radius: 14px; background: var(--accent-bg); color: var(--accent-hi); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; flex: 0 0 auto; }
.datum-box b { font-family: var(--display); font-size: 20px; }
.datum-box small { font-size: 11px; text-transform: uppercase; }
.termin-zeile .t { flex: 1 1 200px; min-width: 0; }
.termin-zeile .t b { display: block; font-size: 15px; }
.termin-zeile .t small { display: block; color: var(--muted); font-size: 12px; }
.termin-zeile .re { display: flex; gap: 6px; flex-wrap: wrap; }
.frist { font-size: 12px; color: var(--soft); }
.frist.nah { color: var(--warn); }

@media (max-width: 760px) {
  .nav { max-width: none; flex-basis: 100%; flex-direction: row; overflow-x: auto; padding: 6px; position: static; }
  .brand, .sync { display: none; }
  .stats { grid-template-columns: 1fr 1fr 1fr; }
  .stat b { font-size: 20px; }
}
@media (prefers-reduced-motion: no-preference) { .btn, .nav a, .modul > button { transition: background 0.15s; } }
</style>

  function naechsteKursTermine(n, tage) {
    var jetzt = new Date(), liste = [];

  // ================= Stundenplan =================
  var START = 8 * 60, ENDE = 20 * 60, PX = 56;
  function stundenplan() {
    var heute = new Date(), mo = montagVon(heute); mo.setDate(mo.getDate() + wochenOffset * 7);
    var fr = new Date(mo); fr.setDate(fr.getDate() + 4);
    var kw = isoKW(mo), gerade = kw % 2 === 0, heuteIdx = wochenOffset === 0 ? (heute.getDay() + 6) % 7 : -1;
    var sichtbar = state.belegungen.filter(function (k) { return k.status === 'laeuft' || (geplanteZeigen && k.status === 'geplant'); });
    var stunden = 0, belegt = [[], [], [], [], []];
    sichtbar.forEach(function (k) { k.termine.forEach(function (t) { if (passtRhythmus(t.rhythmus, kw) && k.status === 'laeuft') { stunden += (minuten(t.bis) - minuten(t.von)) / 60; belegt[t.tag].push([minuten(t.von), minuten(t.bis)]); } }); });

    var h = '<header class="kopf"><div><p>' + esc(semesterVon(mo)) + ' · ' + fmtCP(stunden) + ' Std. in dieser Woche</p><h1>Stundenplan</h1></div><div class="aktionen">';
    h += '<div class="wochen-nav"><button type="button" class="icon-btn" data-action="woche" data-d="-1" aria-label="Vorherige Woche">‹</button><div><b>KW ' + kw + ' · ' + datumKurz(mo) + '–' + datumKurz(fr) + '</b><small>' + (gerade ? 'gerade Woche' : 'ungerade Woche') + (wochenOffset ? ' · <button type="button" data-action="woche" data-d="0" style="background:none;border:0;color:var(--accent-hi);cursor:pointer;padding:0;font-size:12px">zu heute</button>' : '') + '</small></div><button type="button" class="icon-btn" data-action="woche" data-d="1" aria-label="Nächste Woche">›</button></div>';
    h += '<button type="button" class="btn primaer" data-action="kurs-neu">+ Veranstaltung</button></div></header>';

    h += '<div class="reihe" style="align-items:flex-start"><section class="karte" style="flex:999 1 640px;padding:18px" aria-label="Wochenraster"><div class="raster-box"><div class="raster"><div></div>';
    for (var i = 0; i < 5; i++) { var d = new Date(mo); d.setDate(d.getDate() + i); h += '<div class="tag-kopf' + (i === heuteIdx ? ' heute' : '') + '"><b>' + TAGE[i] + '</b><small>' + datumKurz(d) + (i === heuteIdx ? ' · heute' : '') + '</small></div>'; }
    var hoehe = (ENDE - START) / 60 * PX;
    h += '<div class="zeiten" style="height:' + hoehe + 'px" aria-hidden="true">';
    for (var s = START; s < ENDE; s += 60) h += '<span style="top:' + ((s - START) / 60 * PX) + 'px">' + (s / 60 < 10 ? '0' : '') + (s / 60) + ':00</span>';
    h += '</div>';
    for (var tg = 0; tg < 5; tg++) {
      h += '<div class="spalte' + (tg === heuteIdx ? ' heute' : '') + '" style="height:' + hoehe + 'px">';
      sichtbar.forEach(function (k) {
        k.termine.forEach(function (t) {
          if (t.tag !== tg || !passtRhythmus(t.rhythmus, kw)) return;
          var a = Math.max(START, minuten(t.von)), b = Math.min(ENDE, minuten(t.bis));
          if (b <= a) return;
          var top = (a - START) / 60 * PX, hh = (b - a) / 60 * PX - 6;
          h += '<button type="button" class="block' + (k.status === 'geplant' ? ' geplant' : '') + '" data-action="kurs-edit" data-id="' + esc(k.id) + '" style="top:' + (top + 3) + 'px;height:' + hh + 'px;background:' + k.farbe + '24;border-color:' + k.farbe + '66"><span class="zeit" style="color:' + esc(k.farbe) + '">' + esc(t.von) + '–' + esc(t.bis) + '</span><b>' + esc(k.titel) + '</b><small>' + esc(modulKurz(k.modulId)) + (t.rhythmus !== 'woechentlich' ? ' · 14-tägig' : '') + (k.status === 'geplant' ? ' · geplant' : '') + '</small></button>';
        });
      });
      if (tg === heuteIdx) { var nm = heute.getHours() * 60 + heute.getMinutes(); if (nm > START && nm < ENDE) h += '<div class="jetzt-linie" style="top:' + ((nm - START) / 60 * PX) + 'px" aria-hidden="true"></div>'; }
      h += '</div>';
    }
    h += '</div></div><label style="display:flex;gap:10px;align-items:center;margin-top:12px;font-size:13px;color:var(--soft);min-height:44px;cursor:pointer"><input type="checkbox" id="geplante" ' + (geplanteZeigen ? 'checked' : '') + ' style="width:18px;height:18px;accent-color:var(--accent)">Geplante Veranstaltungen gestrichelt einblenden</label></section>';

    h += '<div style="flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:20px">';
    var laufend = state.belegungen.filter(function (k) { return k.status === 'laeuft'; });
    var cpLauf = laufend.reduce(function (a, k) { return a + (k.modulId !== 'SONST' ? k.cp : 0); }, 0);
    h += '<section class="karte" aria-labelledby="h-kurse"><h2 id="h-kurse">Laufende Veranstaltungen · ' + fmtCP(cpLauf) + ' CP</h2>';
    if (!laufend.length) h += '<div class="leer">Noch nichts eingetragen.<button type="button" class="btn klein" data-action="kurs-neu">+ Erste Veranstaltung</button></div>';
    laufend.forEach(function (k) {
      h += '<div class="zeile wrap"><span class="punkt" style="background:' + esc(k.farbe) + '"></span><button type="button" data-action="kurs-edit" data-id="' + esc(k.id) + '" class="t" style="background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--fg)"><b>' + esc(k.titel) + '</b><small>' + esc(modulKurz(k.modulId)) + ' · ' + esc(k.termine.map(function (t) { return TAGE[t.tag] + ' ' + t.von + '–' + t.bis + (t.rhythmus !== 'woechentlich' ? ' (14-tägig)' : ''); }).join(' · ') || 'ohne Termin') + '</small></button>' + (k.moodle ? '<a class="btn klein" href="' + esc(k.moodle) + '" target="_blank" rel="noopener">Moodle</a>' : '') + '<span class="num" style="font-family:var(--display);font-weight:600;white-space:nowrap">' + fmtCP(k.cp) + ' CP</span></div>';
    });
    h += '</section><section class="karte betont" aria-labelledby="h-frei"><h2 id="h-frei">Freie Zeitfenster</h2><p class="leise">Diese Woche zwischen 8 und 18 Uhr, mindestens eine Stunde.</p>';
    for (var f = 0; f < 5; f++) { var frei = freieFenster(belegt[f]); h += '<div style="display:flex;gap:12px;font-size:14px"><span style="width:28px;font-family:var(--display);font-weight:600;color:var(--accent)">' + TAGE[f] + '</span><span>' + (frei.length ? frei.join(' · ') : 'voll') + '</span></div>'; }
    return h + '</section></div></div>';
  }
  function freieFenster(busy) {
    var a = 8 * 60, e = 18 * 60, res = [], cur = a;
    busy.slice().sort(function (x, y) { return x[0] - y[0]; }).forEach(function (b) { if (b[0] - cur >= 60) res.push([cur, Math.min(b[0], e)]); cur = Math.max(cur, b[1]); });
    if (e - cur >= 60) res.push([cur, e]);
    var fmt = function (m) { var hh = Math.floor(m / 60), mm = m % 60; return (hh < 10 ? '0' : '') + hh + (mm ? ':' + (mm < 10 ? '0' : '') + mm : ''); };
    var out = res.filter(function (r) { return r[1] - r[0] >= 60; }).map(function (r) { return fmt(r[0]) + '–' + fmt(r[1]); });
    if (out.length === 1 && out[0] === '08–18') return ['ganztags frei'];
    return out.map(function (x) { return x + ' Uhr'; });
  }

  // ================= Prüfungen & Termine =================

    var archiv = state.termine.filter(function (t) { return t.erledigt || ausIso(t.datum) < heute; }).sort(function (a, b) { return a.datum > b.datum ? -1 : 1; });

  function terminZeile(t, archiv) {

    } else if (t !== null) {
      var key = el.getAttribute('data-k'), ti = Number(t);
      entwurf.termine[ti][key] = key === 'tag' ? Number(el.value) : el.value;
      if (key === 'von' && minuten(entwurf.termine[ti].bis) <= minuten(el.value)) {
        var nb = minuten(el.value) + 120; entwurf.termine[ti].bis = ('0' + Math.floor(nb / 60)).slice(-2) + ':' + ('0' + nb % 60).slice(-2);
        var bisEl = document.getElementById('t-bis-' + t); if (bisEl) bisEl.value = entwurf.termine[ti].bis;
      }
    } else return;
    var kc = document.getElementById('konflikte'); if (kc) kc.innerHTML = konfliktHtml();
  }

  // ================= Aktionen =================
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) { if (e.target.id === 'overlay') dialogZu(); return; }
    var a = el.getAttribute('data-action'), id = el.getAttribute('data-id');
    if (a === 'farbe') { state.farbe = el.getAttribute('data-farbe'); speichern(); render(); }
    else if (a === 'kurs-neu') dialogOeffnen(null);
    else if (a === 'kurs-edit') { var k = state.belegungen.filter(function (x) { return x.id === id; })[0]; if (k) dialogOeffnen(k); }
    else if (a === 'lv-eintragen') {
      var lv = LV[el.getAttribute('data-lv')], mod = el.getAttribute('data-modul');
      if (lv) dialogOeffnen(null, { lvId: lv.id, modulId: lv.modul, titel: lv.titel, cp: lv.cp, status: 'geplant', semester: naechstesSem(), termine: [] });
      else if (mod) dialogOeffnen(null, { modulId: mod, status: 'geplant', semester: aktSem(), termine: [] });
    }
    else if (a === 'dlg-zu') dialogZu();
    else if (a === 'termin-plus') { var lt = entwurf.termine[entwurf.termine.length - 1]; entwurf.termine.push(lt ? { tag: Math.min(4, lt.tag + 1), von: lt.von, bis: lt.bis, rhythmus: lt.rhythmus } : { tag: 0, von: '08:00', bis: '10:00', rhythmus: 'woechentlich' }); dialogRender(); }
    else if (a === 'termin-weg') { entwurf.termine.splice(Number(el.getAttribute('data-i')), 1); dialogRender(); }
    else if (a === 'kursfarbe') { entwurf.farbe = el.getAttribute('data-c'); dialogRender(); }
    else if (a === 'loeschen') { loeschBestaetigen = true; dialogRender(); }
    else if (a === 'loeschen-nein') { loeschBestaetigen = false; dialogRender(); }
    else if (a === 'loeschen-ja') { var did = entwurf.id; state.belegungen = state.belegungen.filter(function (x) { return x.id !== did; }); dialogZu(); speichern(); render(); }
    else if (a === 'dlg-speichern') {
      var d = entwurf;
      if (!d.titel.trim()) { var ti = document.getElementById('f-titel'); ti.focus(); ti.setAttribute('aria-invalid', 'true'); ti.placeholder = 'Bitte einen Namen eintragen'; return; }
      d.titel = d.titel.trim();
      d.moodle = /^https?:\/\//i.test((d.moodle || '').trim()) ? d.moodle.trim() : '';
      var idx = state.belegungen.map(function (x) { return x.id; }).indexOf(d.id);
      if (idx >= 0) state.belegungen[idx] = d; else state.belegungen.push(d);
      dialogZu(); speichern(); render();
    }
    else if (a === 'woche') { var dd = Number(el.getAttribute('data-d')); wochenOffset = dd === 0 ? 0 : wochenOffset + dd; render(); }
    else if (a === 'studium-tab') { studiumTab = el.getAttribute('data-tab'); render(); }
    else if (a === 'filter') { modulFilter = el.getAttribute('data-f'); render(); }
    else if (a === 'modul') { var m = el.getAttribute('data-m'); offenesModul = offenesModul === m ? null : m; render(); }
    else if (a === 'schwerpunkt') { state.schwerpunkt = el.getAttribute('data-sp'); speichern(); render(); }
    else if (a === 'nachweis') { state.nachweise[id] = !state.nachweise[id]; speichern(); render(); }
    else if (a === 'planen') {
      var pl = LV[el.getAttribute('data-lv')];
      state.belegungen.push({ id: neueId('k'), lvId: pl.id, modulId: pl.modul, titel: pl.titel, cp: pl.cp, semester: el.getAttribute('data-sem'), status: 'geplant', farbe: freieFarbe(), termine: [], moodle: '', notiz: '' });
      speichern(); render();
    }
    else if (a === 'aufgabe-toggle') { state.aufgaben.forEach(function (t) { if (t.id === id) t.erledigt = !t.erledigt; }); speichern(); render(); }
    else if (a === 'aufgabe-del') { state.aufgaben = state.aufgaben.filter(function (t) { return t.id !== id; }); speichern(); render(); }
    else if (a === 'termin-neu') terminOeffnen(null, el.getAttribute('data-typ'), el.getAttribute('data-m'));
    else if (a === 'termin-edit') { var te = state.termine.filter(function (t) { return t.id === id; })[0]; if (te) terminOeffnen(te); }
    else if (a === 'termin-abbruch') { terminEntwurf = null; render(); }
    else if (a === 'termin-speichern') {
      var tf = terminEntwurf, fe = document.getElementById('tf-fehler');
      if (!tf.titel.trim()) { fe.textContent = 'Bitte einen Titel eintragen.'; document.getElementById('tf-titel').focus(); return; }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(tf.datum)) { fe.textContent = 'Bitte ein Datum wählen.'; document.getElementById('tf-datum').focus(); return; }
      tf.titel = tf.titel.trim();
      var ti2 = state.termine.map(function (t) { return t.id; }).indexOf(tf.id);
      if (ti2 >= 0) state.termine[ti2] = tf; else state.termine.push(tf);
      if (tf.typ === 'pruefung' && tf.modulId && ergebnis(tf.modulId).pruefung === 'offen') { state.modulErgebnis[tf.modulId] = { pruefung: 'angemeldet', note: null }; }
      terminEntwurf = null; speichern(); render();
    }
    else if (a === 'termin-erledigt') { state.termine.forEach(function (t) { if (t.id === id) t.erledigt = true; }); speichern(); render(); }
    else if (a === 'termin-del') { loeschId = id; render(); }
    else if (a === 'termin-del-nein') { loeschId = null; render(); }
    else if (a === 'termin-del-ja') { state.termine = state.termine.filter(function (t) { return t.id !== id; }); loeschId = null; speichern(); render(); }
    else if (a === 'archiv') { archivOffen = !archivOffen; render(); }
    else if (a === 'export-datei') {
      try {
        var blob = new Blob([JSON.stringify(exportObjekt(), null, 2)], { type: 'application/json' });
        var link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'studicockpit-sicherung-' + isoDatum(new Date()) + '.json';
        document.body.appendChild(link); link.click(); link.remove();
        exportStatus = 'Sicherung wird heruntergeladen. Falls nichts passiert, nimm „In die Zwischenablage kopieren“.';
      } catch (x) { exportStatus = 'Herunterladen geht hier nicht. Nimm „In die Zwischenablage kopieren“.'; }
      render();
    }
    else if (a === 'export-kopie') {
      var txt = JSON.stringify(exportObjekt());
      var fallback = function () { exportStatus = 'Kopieren wurde blockiert. Der Text steht jetzt im Feld „Sicherung hier einfügen“ – markieren und kopieren.'; render(); var ta = document.getElementById('import-text'); if (ta) { ta.value = txt; ta.select(); } };
      try { navigator.clipboard.writeText(txt).then(function () { exportStatus = 'Kopiert. Füge den Text auf dem anderen Gerät unter „Sicherung laden“ ein.'; render(); }, fallback); } catch (x) { fallback(); }
    }
    else if (a === 'sync-neu') {
      var code = neuerCode(); syncFehler = ''; syncHinweis = '';
      if (!state.geaendert) state.geaendert = new Date().toISOString();
      el.disabled = true; el.textContent = 'Richte ein …';
      rpc('sync_put', { code: code, new_data: JSON.parse(JSON.stringify(state)), base_version: null }).then(function (res) {
        if (!res || !res.ok) throw { text: 'nur_ein_code' };
        sync = { code: code, version: res.version, dirty: false, letzter: new Date().toISOString() }; codeSichtbar = true; syncMerken(); basisSetzen(state); syncStarten();
      }).catch(function (e2) { syncFehler = syncFehlerText(e2); }).then(function () { syncStatusZeigen(); render(); });
    }
    else if (a === 'sync-pruefen') {
      var eing = codeNorm((document.getElementById('sync-code') || {}).value);
      syncFehler = ''; codeVorschau = null;
      if (eing.length < 24) { syncFehler = 'Der Code ist zu kurz. Er hat 32 Zeichen, die Striche kannst du weglassen.'; render(); return; }
      rpc('sync_get', { code: eing }).then(function (res) {
        if (!res) { syncFehler = 'Diesen Code gibt es nicht. Prüf ihn bitte noch einmal auf dem ersten Gerät.'; return; }
        var vs = normalisieren(res.data); delete vs._migriert;
        codeVorschau = { code: eing, version: res.version, state: vs, roh: res.data, updated: res.updated_at };
      }).catch(function (e2) { syncFehler = syncFehlerText(e2); }).then(render);
    }
    else if (a === 'sync-uebernehmen' && codeVorschau) {
      stateUebernehmen(codeVorschau.roh);
      sync = { code: codeVorschau.code, version: codeVorschau.version, dirty: false, letzter: new Date().toISOString() };
      codeVorschau = null; syncMerken(); syncStarten(); syncStatusZeigen(); location.hash = 'dashboard'; render();
    }
    else if (a === 'sync-abbruch') { codeVorschau = null; render(); }
    else if (a === 'sync-jetzt') { syncHinweis = ''; if (sync && sync.dirty) syncPush(); else syncPull(); }
    else if (a === 'sync-zeigen') { codeSichtbar = !codeSichtbar; render(); }
    else if (a === 'sync-kopieren' && sync) {
      var ct = codeAnzeige(sync.code);
      try { navigator.clipboard.writeText(ct).then(function () { syncHinweis = 'Code kopiert.'; render(); }, function () { codeSichtbar = true; syncHinweis = 'Kopieren wurde blockiert – der Code steht oben, bitte abschreiben.'; render(); }); } catch (x) { codeSichtbar = true; render(); }
    }
    else if (a === 'sync-beenden') { syncBeendenFrage = true; render(); }
    else if (a === 'sync-beenden-nein') { syncBeendenFrage = false; render(); }
    else if (a === 'sync-beenden-ja') { sync = null; syncBeendenFrage = false; syncFehler = ''; syncHinweis = ''; clearInterval(syncTimer); syncMerken(); syncStatusZeigen(); render(); }
    else if (a === 'import-pruefen') { var it = document.getElementById('import-text'); importLesen(it ? it.value : ''); }
    else if (a === 'import-nein') { importVorschau = null; render(); }
    else if (a === 'import-ja') { state = importVorschau; importVorschau = null; exportStatus = ''; speichern(); location.hash = 'dashboard'; render(); }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'aufgabe-form') return;
    e.preventDefault();
    var inp = document.getElementById('aufgabe-text'), txt = inp.value.trim();
    if (!txt) return;
    state.aufgaben.push({ id: neueId('a'), text: txt, erledigt: false });
    inp.value = ''; speichern(); render();
    var neu = document.getElementById('aufgabe-text'); if (neu) neu.focus();
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'geplante') { geplanteZeigen = el.checked; render(); }
    else if (el.id === 'ziel-sem') { zielSemester = el.value; render(); }
    else if (el.id === 'import-datei' && el.files && el.files[0]) { var fr = new FileReader(); fr.onload = function () { importLesen(String(fr.result)); }; fr.onerror = function () { importFehler = 'Die Datei konnte nicht gelesen werden.'; render(); }; fr.readAsText(el.files[0]); el.value = ''; }
    else if (el.getAttribute && el.getAttribute('data-erg')) {
      var mid = el.getAttribute('data-m'), feld = el.getAttribute('data-erg'), r = JSON.parse(JSON.stringify(ergebnis(mid)));
      if (feld === 'pruefung') r.pruefung = el.value;
      else { var n = Number(String(el.value).replace(',', '.')); r.note = n >= 1 && n <= 5 ? Math.round(n * 10) / 10 : null; if (r.note && (r.pruefung === 'offen' || r.pruefung === 'angemeldet')) r.pruefung = r.note <= 4 ? 'bestanden' : 'nicht_bestanden'; }
      state.modulErgebnis[mid] = r; speichern(); render();
    }
  });
  document.addEventListener('input', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-tf');
    if (k && terminEntwurf) terminEntwurf[k] = e.target.value;
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && entwurf) dialogZu(); });

  // ================= Darstellung & Navigation =================
  var ANSICHTEN = { dashboard: dashboard, studium: studium, stundenplan: stundenplan, termine: termine, daten: datenAnsicht };
  function render() {
    farbeAnwenden();
    var main = document.getElementById('main'), scroll = window.scrollY;
    var ae = document.activeElement, aktiv = ae && ae.id, auswahl = null;
    try { if (ae && typeof ae.selectionStart === 'number') auswahl = [ae.selectionStart, ae.selectionEnd]; } catch (x) { /* kein Textfeld */ }
    var behalten = {};
    ['aufgabe-text', 'sync-code', 'import-text'].forEach(function (fid) { var x = document.getElementById(fid); if (x && x.value) behalten[fid] = x.value; });
    var html = (ANSICHTEN[ansicht] || dashboard)();
    if (!ladeFertig && !state.belegungen.length) html += '<p class="leise">Lade deine Daten …</p>';
    main.innerHTML = html;
    Object.keys(behalten).forEach(function (fid) { var x = document.getElementById(fid); if (x && !x.value) x.value = behalten[fid]; });
    document.querySelectorAll('.nav a[data-view]').forEach(function (a) { if (a.getAttribute('data-view') === ansicht) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    if (aktiv && !entwurf) { var f = document.getElementById(aktiv); if (f) { f.focus({ preventScroll: true }); if (auswahl && f.setSelectionRange) { try { f.setSelectionRange(auswahl[0], auswahl[1]); } catch (x) { /* egal */ } } } }
    window.scrollTo(0, scroll);
  }
  function zielAnsicht() {
    var h = (location.hash || '').replace('#', '');
    if (h === 'planer') return 'studium';
    return ANSICHTEN[h] ? h : 'dashboard';
  }
  window.addEventListener('hashchange', function () {
    var neu = zielAnsicht();
    if (neu !== ansicht) { ansicht = neu; loeschId = null; if (neu !== 'termine') terminEntwurf = null; render(); window.scrollTo(0, 0); }
  });
  ansicht = zielAnsicht();
  render();
  setInterval(function () { var ae = document.activeElement; if (!entwurf && !terminEntwurf && !(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName))) render(); }, 60000);
  verbinden();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
